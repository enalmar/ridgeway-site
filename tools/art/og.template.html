<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<title>Ridgeway og.png</title>
<!-- Rendered to ../og.png (1200 x 630) by og.py, which fills the double-brace placeholders below. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(520px 380px at 900px 300px, rgba(64,156,255,.16), rgba(30,106,232,.05) 55%, transparent 75%),
      linear-gradient(180deg, #0C0E13 0%, #111214 100%);
    /* Marketing art avoids SF (licensed for UI mock-ups only; BRAND §3.3): Helvetica Neue, as in the web stack fallback. */
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #F2F2EE;
    -webkit-font-smoothing: antialiased;
  }
  .contours { position: absolute; inset: 0; color: rgba(170,190,220,.15);
              -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 42%, rgba(0,0,0,.25) 62%, rgba(0,0,0,.25) 100%); }
  .contours svg { width: 100%; height: 100%; display: block; }
  
  .vignette { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(12,14,19,.80) 0%, rgba(12,14,19,.45) 40%, rgba(12,14,19,0) 60%); }
  .route { position: absolute; right: -10px; top: 50%; width: 700px; transform: translateY(-50%);
           --rw-contour: #9DB8E0; --rw-contour-minor: .16; --rw-contour-index: .30; --rw-ground: #10131A; --rw-glow: .5; }
  .route svg { width: 100%; height: auto; display: block; }
  .route.terrain { -webkit-mask-image: radial-gradient(closest-side, #000 65%, transparent 100%); }
  .route.terrain .rw-line, .route.terrain .rw-glow, .route.terrain .rw-start, .route.terrain .rw-top { display: none; }
  .route.line { --rw-contour-minor: 0; --rw-contour-index: 0; }
  .route .rw-line { stroke-width: 8; }
  .route .rw-glow { stroke-width: 22; }
  .route .rw-start { r: 17px; stroke-width: 6; }
  .route .rw-top { r: 8px; }
  .copy { position: absolute; left: 88px; top: 0; bottom: 0; width: 520px;
          display: flex; flex-direction: column; justify-content: center; }
  .icon { width: 112px; height: 112px; border-radius: 25px; display: block;
          box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 48px rgba(0,0,0,.55); }
  h1 { margin: 34px 0 0; font-size: 92px; line-height: 1; font-weight: 500; letter-spacing: -0.025em; }
  p  { margin: 22px 0 0; font-size: 32px; line-height: 1.25; font-weight: 400; color: rgba(242,242,238,.72);
       letter-spacing: -0.005em; }
  .foot { position: absolute; left: 88px; bottom: 44px; font-size: 19px; letter-spacing: .01em;
          color: rgba(242,242,238,.42); }
  .foot b { font-weight: 500; color: rgba(242,242,238,.62); }
</style>
<div class="contours">{{CONTOURS}}</div>
<div class="vignette"></div>
<div class="route terrain">{{ROUTE}}</div>
<div class="route line">{{ROUTE}}</div>
<div class="copy">
  <img class="icon" src="{{ICON}}" alt="">
  <h1>Ridgeway</h1>
  <p>{{TAGLINE}}</p>
</div>
<div class="foot"><b>iPhone and Apple Watch</b> &nbsp;·&nbsp; ridgeway.enalmar.uk</div>
</html>
